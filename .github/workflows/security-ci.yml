name: Infrastructure Security & Governance Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security-and-compliance-scan:
    name: Run Checkov & OPA Policy Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup HashiCorp Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Checkov Static Analysis
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: true

      - name: Initialize Terraform and Generate JSON Plan
        run: |
          cd terraform
          terraform init -backend=false
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary > tfplan.json

      - name: Install Conftest (Open Policy Agent Engine)
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.42.0/conftest_0.42.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.42.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Evaluate Custom OPA/Rego Governance Policies
        run: conftest test terraform/tfplan.json --policy policy/
