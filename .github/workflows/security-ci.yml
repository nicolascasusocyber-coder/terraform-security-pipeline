name: Terraform security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/install-checks.sh
      - name: Run positive and negative security tests
        shell: bash
        run: |
          mkdir -p evidence
          bash scripts/test-security.sh 2>&1 | tee evidence/security-checks.log
      - name: Save security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-checks
          path: evidence/security-checks.log
          if-no-files-found: ignore
          retention-days: 14
